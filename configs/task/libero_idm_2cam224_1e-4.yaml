# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_idm
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  compile_training_denoise: false
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

# 与参考版一致；仅本任务默认保留最近两组 checkpoint。
keep_last_ckpts: 2
